name: Check upstream releases

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve Debian MariaDB version
        id: mariadb
        run: |
          version="$(docker run --rm debian:forky-slim bash -c \
            'apt-get update >/dev/null 2>&1 && apt-cache policy mariadb-server' \
            | awk '/Candidate:/ { sub(/^1:/, "", $2); print $2 }')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check pinned upstream releases
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-upstream.py --mariadb-version "${{ steps.mariadb.outputs.version }}"

      - name: Build proposed image
        if: steps.update.outputs.changed == 'true'
        run: |
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION="${{ steps.update.outputs.version }}" \
            --build-arg BUILD_NAME="MariaDB Server Enhanced" \
            --build-arg BUILD_DESCRIPTION="A current MariaDB server for Home Assistant with external data storage" \
            --build-arg BUILD_REPOSITORY="${{ github.repository }}" \
            --build-arg BUILD_REF="${{ github.sha }}" \
            --tag "ghcr.io/wheemer/amd64-app-mariadb-server:${{ steps.update.outputs.version }}" \
            mariadb

      - name: Log in to GitHub Container Registry
        if: steps.update.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: steps.update.outputs.changed == 'true'
        run: docker push "ghcr.io/wheemer/amd64-app-mariadb-server:${{ steps.update.outputs.version }}"

      - name: Open and merge dependency pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/upstream-updates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add mariadb/config.yaml mariadb/Dockerfile mariadb/CHANGELOG.md
          git commit -m "Update pinned upstream dependencies"
          git push --force origin "$branch"
          pr_url="$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "Update pinned upstream dependencies" \
              --body "Automated upstream update. The proposed image completed a clean cloud build and was published to GHCR. This pull request is merged automatically; Home Assistant installs the new app version through auto-update.")"
          else
            gh pr edit "$pr_url" \
              --title "Update pinned upstream dependencies" \
              --body "Automated upstream update. The proposed image completed a clean cloud build and was published to GHCR. This pull request is merged automatically; Home Assistant installs the new app version through auto-update."
          fi
          gh pr merge "$pr_url" --squash --delete-branch

      - name: Publish GitHub release
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.update.outputs.version }}" \
            --target main \
            --title "v${{ steps.update.outputs.version }}" \
            --generate-notes

      - name: Report official app changes for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewed="$(tr -d '[:space:]' < .github/upstream-ref)"
          latest="$(gh api 'repos/home-assistant/addons/commits?path=mariadb&per_page=1' --jq '.[0].sha')"
          if [ "$latest" = "$reviewed" ]; then
            exit 0
          fi
          title="Review newer official Home Assistant MariaDB app changes"
          if gh issue list --state open --search "in:title $title" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create \
              --title "$title" \
              --body "The official Home Assistant MariaDB app changed after reviewed commit \`$reviewed\`. Review changes through \`$latest\` and port only the parts compatible with this app's Debian base and external data path. Update \`.github/upstream-ref\` after that review."
          fi
